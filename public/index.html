<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LearnApp">
    <title>The Way Things Work</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Loading screen -->
    <div id="loader" class="loader">
        <div class="loader-content">
            <div class="loader-icon">📖</div>
            <div class="loader-text">Loading book...</div>
            <div class="loader-bar"><div class="loader-fill"></div></div>
        </div>
    </div>

    <!-- Top bar -->
    <header id="topbar" class="topbar hidden">
        <div class="topbar-left">
            <button id="btn-toc" class="icon-btn" aria-label="Bookmarks">☰</button>
        </div>
        <div class="topbar-center">
            <span id="page-indicator">Page 1</span>
        </div>
        <div class="topbar-right">
            <button id="btn-mode" class="icon-btn" aria-label="Switch mode" title="Switch mode">📖</button>
            <button id="btn-bookmark" class="icon-btn" aria-label="Bookmark">📑</button>
            <button id="btn-settings" class="icon-btn" aria-label="Settings">⚙️</button>
        </div>
    </header>

    <!-- Main reader area — reels mode (default) -->
    <main id="reader-reels" class="reader-reels">
        <!-- Reel cards injected by JS -->
    </main>

    <!-- Main reader area — book mode -->
    <main id="reader-book" class="reader-book hidden">
        <!-- Sequential page cards injected by JS -->
    </main>

    <!-- Page number pill (shows briefly on scroll in reels mode) -->
    <div id="page-pill" class="page-pill hidden">Page 42</div>

    <!-- Bottom progress bar (book mode only) -->
    <div id="progress-bar" class="progress-bar hidden">
        <div id="progress-fill" class="progress-fill"></div>
    </div>

    <!-- Page slider (book mode, tap center to show) -->
    <div id="page-slider-container" class="page-slider-container hidden">
        <input type="range" id="page-slider" class="page-slider" min="1" max="402" value="1">
        <span id="slider-label" class="slider-label">Page 1</span>
    </div>

    <!-- Bookmarks panel -->
    <div id="bookmarks-panel" class="side-panel hidden">
        <div class="panel-header">
            <h2>Bookmarks</h2>
            <button class="icon-btn" id="close-bookmarks">✕</button>
        </div>
        <div id="bookmarks-list" class="panel-list">
            <p class="empty-msg">No bookmarks yet. Tap 📑 to add one.</p>
        </div>
    </div>

    <!-- Settings panel -->
    <div id="settings-panel" class="side-panel hidden">
        <div class="panel-header">
            <h2>Settings</h2>
            <button class="icon-btn" id="close-settings">✕</button>
        </div>
        <div class="panel-body">
            <label class="setting-row">
                <span>Background</span>
                <select id="theme-select">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                    <option value="sepia">Sepia</option>
                </select>
            </label>
        </div>
    </div>

    <!-- Overlay for panels -->
    <div id="overlay" class="overlay hidden"></div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
