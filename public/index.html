<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LearningApp — Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 2rem;
        }
        .card {
            background: #1a1a2e;
            border-radius: 1rem;
            padding: 2rem;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #888; font-size: 0.95rem; line-height: 1.5; }
        .check { font-size: 3rem; margin-bottom: 1rem; }
        .swipe-hint {
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background: #16213e;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">✅</div>
        <h1>GitHub Pages Works!</h1>
        <p>If you can see this on your phone, the deployment pipeline is confirmed.</p>
        <div class="swipe-hint">👈 Swipe gestures coming soon 👉</div>
    </div>
</body>
</html>
